# Audits the workflows and dependabot.yml with the jactionlint mise.lock verifies; bump it with
# `mise use jactionlint@X.Y.Z && mise lock jactionlint`. Suppress inline: `# jactionlint ignore=<rule>`.

name: Workflow audit

on:
  pull_request:
    paths:
      - ".github/**"
      - "mise.toml"
      - "mise.lock"
  schedule:
    # Weekly sweep: the online checks catch a pinned action archived or advised against since.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install jactionlint and shellcheck
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: jactionlint shellcheck

      - name: Audit the workflows and dependabot.yml
        run: jactionlint --online --format github
        env:
          GITHUB_TOKEN: ${{ github.token }}
