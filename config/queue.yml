default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # mailers first: a sign-in link is claimed ahead of backups and sweeps.
    # Queue conventions: app/docs/developer/background-jobs.md.
    - queues: [ mailers, default, low ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
